name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    # The app uses iOS 26 SDK APIs, so it needs Xcode 26 (macos-26 runner).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          ls /Applications | grep -i xcode
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          echo "Selecting: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build (unsigned)
        run: |
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          echo "Using project: $PROJECT"
          xcodebuild \
            -project "$PROJECT" \
            -scheme OpenCodeClient \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r OpenCodeClient.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: OpenCodeClient-unsigned-ipa
          path: OpenCodeClient.ipa
